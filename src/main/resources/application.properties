spring.application.name=users-service-devsecops

server.port=8080

# H2 in-memory database (data is cleared when the application stops)
spring.datasource.url=jdbc:h2:mem:usersdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create/update the schema for this learning application
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 browser console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Keep error responses controlled by GlobalExceptionHandler
server.error.include-message=never
